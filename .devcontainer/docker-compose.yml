services:
  cookit:
    build:
      context: .
      args:
        DIOXUS_VERSION: ${DIOXUS_VERSION}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION}
      secrets:
        - github_token
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/home/vscode/.claude.json
      - cargo-registry:/home/vscode/.cargo/registry
      - cargo-git:/home/vscode/.cargo/git
      - sccache:/home/vscode/.cache/sccache
    environment:
      COLORTERM: truecolor
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/cookit_dev"
      WORKSPACE_DIR: ${WORKSPACE_DIR}
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/vscode/.cache/sccache
      SCCACHE_CACHE_SIZE: 5G
    depends_on:
      - postgres

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cookit
    volumes:
      - pg_data:/var/lib/postgresql

secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-/dev/null}

volumes:
  pg_data:
  cargo-registry:
    name: cookit-cargo-registry
  cargo-git:
    name: cookit-cargo-git
  sccache:
    name: cookit-sccache
