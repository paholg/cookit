services:
  app:
    build:
      context: .
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - cookit-rust-target-cache:/workspace/target
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/home/vscode/.claude.json
    environment:
      COLORTERM: truecolor
      DATABASE_URL: "sqlite:///workspace/dev/cookit.db"
      WORKSPACE_DIR: ${WORKSPACE_DIR}

volumes:
  cookit-rust-target-cache:
    name: cookit-rust-target-cache
    external: true
