services:
  cookit:
    build:
      context: .
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspace:cached

      # Synced settings from host:
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/home/vscode/.claude.json

      # Cache volumes:
      - nix-store:/nix
      - cargo-registry:/home/vscode/.cargo/registry
      - cargo-git:/home/vscode/.cargo/git
      - sccache:/home/vscode/.cache/sccache
    environment:
      COLORTERM: truecolor
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/cookit_dev"
      BASE_DOMAIN: "${WORKSPACE_DIR}.cookit.test"
      WORKSPACE_DIR: ${WORKSPACE_DIR}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cookit_dev
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cookit_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  pg_data:
  nix-store:
    name: cookit-nix-store
    external: true
  cargo-registry:
    name: cookit-cargo-registry
    external: true
  cargo-git:
    name: cookit-cargo-git
    external: true
  sccache:
    name: cookit-sccache
    external: true
