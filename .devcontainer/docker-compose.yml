services:
  cookit:
    build:
      context: .
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/home/vscode/.claude.json
    environment:
      COLORTERM: truecolor
      DATABASE_URL: "sqlite:///workspace/dev/cookit.db"
      WORKSPACE_DIR: ${WORKSPACE_DIR}
