services:
  app:
    build:
      context: .
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/home/vscode/.claude.json
    environment:
      COLORTERM: truecolor
      DATABASE_URL: "sqlite:///workspace/dev/cookit.db"
      WORKSPACE_DIR: ${WORKSPACE_DIR}
      OIDC_ISSUER_URL: "https://${WORKSPACE_DIR}.oidc.test/admin"
      OIDC_CLIENT_ID: "cookit"
      OIDC_CLIENT_SECRET: "anything"
      OIDC_REDIRECT_URL: "http://${WORKSPACE_DIR}.app.test/auth/callback"
      # The dev proxy's TLS cert isn't trusted inside the container. Don't
      # ship a build with this on.
      OIDC_INSECURE_TLS: "true"
      SESSION_SECRET: "ZGV2LXNlc3Npb24tc2VjcmV0LWRldi1zZXNzaW9uLXNlY3JldC1kZXYtc2Vzc2lvbi1zZWNyZXQtZGV2LXNlc3Npb24tc2VjcmV0LWQK"
      SESSION_COOKIE_SECURE: "false"

  # Local OIDC provider for dev. Two issuers (`admin`, `user`) with
  # `interactiveLogin: false` so /authorize bounces straight back with
  # hardcoded claims — one click from the navbar lands you logged in. The
  # `user` issuer is here so you can swap the app's OIDC_ISSUER_URL to it to
  # exercise non-admin code paths without needing a real IdP.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - 8090:8090
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "admin",
              "requestMappings": [{
                "requestParam": "grant_type",
                "match": "authorization_code",
                "claims": {
                  "sub": "dev-admin",
                  "email": "admin@cookit.dev",
                  "name": "Dev Admin",
                  "preferred_username": "admin",
                  "groups": ["cookit_admin"]
                }
              }]
            },
            {
              "issuerId": "user",
              "requestMappings": [{
                "requestParam": "grant_type",
                "match": "authorization_code",
                "claims": {
                  "sub": "dev-user",
                  "email": "user@cookit.dev",
                  "name": "Dev User",
                  "preferred_username": "user",
                  "groups": ["cookit_user"]
                }
              }]
            }
          ]
        }
