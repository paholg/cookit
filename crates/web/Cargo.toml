[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
api = { workspace = true }
async-trait = { workspace = true }
console_error_panic_hook = "0.1"
dioxus = { workspace = true, features = ["fullstack", "router"] }
gloo-storage = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ui = { workspace = true }
uuid = { workspace = true, features = ["js", "v4"] }
web-time = "1"

[features]
default = []
# Pulls in the /api/dev/* test-data endpoints (used by the e2e suite).
development = ["api/development"]
server = ["api/server", "dioxus/server"]
web = ["api/web", "dioxus/web"]
