[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { workspace = true }
async-trait = { workspace = true }
console_error_panic_hook = "0.1"
dioxus = { workspace = true, features = ["fullstack", "router"] }
gloo-storage = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }
serde_json = "1"
ui = { workspace = true }
web-time = "1"

[features]
default = []
development = ["api/development"]
server = ["api/server", "dioxus/server"]
web = ["api/web", "dioxus/web"]
