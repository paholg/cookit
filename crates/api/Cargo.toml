[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
cookie = { version = "0.18", features = ["signed"], optional = true }
diesel = { workspace = true, optional = true }
diesel-async = { version = "0.9.0", features = [
  "deadpool",
  "migrations",
  "postgres"
], optional = true }
diesel-derive-enum = { workspace = true, optional = true }
diesel_migrations = { version = "2.3", optional = true }
dioxus = { workspace = true, features = ["fullstack"] }
figment = { version = "0.10.19", features = ["env"], optional = true }
jiff.workspace = true
jiff-diesel = { version = "0.1.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = { version = "0.9.1" }
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true

[features]
default = ["server", "web"]
server = [
  "dep:axum",
  "dep:cookie",
  "dep:diesel",
  "dep:diesel-async",
  "dep:diesel-derive-enum",
  "dep:diesel_migrations",
  "dep:figment",
  "dep:jiff-diesel",
  "dioxus/server",
  "jiff-diesel/postgres",
]
web = []
