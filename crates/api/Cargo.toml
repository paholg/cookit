[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
cookie = { version = "0.18", features = ["percent-encode", "signed"] }
diesel = { workspace = true, optional = true }
diesel-async = { version = "0.9.0", features = ["deadpool", "postgres"], optional = true }
diesel-derive-enum = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["fullstack"] }
figment = { version = "0.10.19", features = ["env"], optional = true }
http = "1"
jiff.workspace = true
jiff-diesel = { version = "0.1.3", optional = true }
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls"
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = { version = "0.9.1" }
strum = { version = "0.28", features = ["derive"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
url = "2"
uuid.workspace = true

[features]
default = ["server", "web"]
server = [
  "dep:diesel",
  "dep:diesel-async",
  "dep:diesel-derive-enum",
  "dep:figment",
  "dep:jiff-diesel",
  "dioxus/server",
  "jiff-diesel/postgres",
]
web = []
