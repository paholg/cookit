[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
db-macros = { workspace = true }
diesel = { workspace = true, optional = true }
diesel-async = { workspace = true, optional = true }
diesel-derive-enum = { workspace = true, optional = true }
email_address.workspace = true
enum_dispatch = { workspace = true, optional = true }
http.workspace = true
jiff.workspace = true
jiff-diesel = { workspace = true, optional = true }
nutype.workspace = true
regex.workspace = true
serde.workspace = true
serde_with.workspace = true
snafu.workspace = true
strum = { version = "0.28", features = ["derive"] }
uuid.workspace = true

# uuid needs an explicit randomness backend when compiled for wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[features]
default = ["server"]
server = [
  "dep:diesel",
  "dep:diesel-async",
  "dep:diesel-derive-enum",
  "dep:enum_dispatch",
  "dep:jiff-diesel",
  "jiff-diesel/postgres",
]
