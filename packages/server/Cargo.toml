[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
cookie = { version = "0.18", features = ["percent-encode", "signed"] }
dioxus = { workspace = true, features = ["fullstack", "server"] }
http = "1"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite"
] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
types = { workspace = true }
url = "2"
