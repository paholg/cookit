[package]
name    = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui     = { workspace = true }
api    = { workspace = true }
strum  = { version = "0.28", features = ["derive"] }

[features]
default = []
web     = ["dioxus/web"]
server  = ["dioxus/server", "ui/server", "api/server"]
