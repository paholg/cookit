[workspace]
resolver = "2"
members = [
  "crates/api",
  "crates/server",
  "crates/types",
  "crates/ui",
  "crates/web",
  "crates/web_client"
]

[workspace.dependencies]
dioxus = { version = "0.7.9" }
jiff = "0.2"

api = { path = "crates/api" }
server = { path = "crates/server" }
types = { path = "crates/types" }
# workspace
ui = { path = "crates/ui" }
web_client = { path = "crates/web_client" }
