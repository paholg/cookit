[workspace]
resolver = "2"
members = ["crates/api", "crates/ui", "crates/web"]

[workspace.dependencies]
api = { path = "crates/api" }
diesel = { version = "2.3", features = ["postgres", "postgres_backend", "uuid"] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
dioxus = { version = "0.7.9" }
jiff = { version = "0.2", features = ["serde"] }
ui = { path = "crates/ui" }
uuid = { version = "1", features = ["serde", "v7"] }
