[workspace]
resolver = "2"
members = [
  "crates/api",
  "crates/db",
  "crates/seed",
  "crates/server",
  "crates/ui",
  "crates/web"
]

[workspace.dependencies]
api = { path = "crates/api", default-features = false }
db = { path = "crates/db", default-features = false }
server = { path = "crates/server" }
ui = { path = "crates/ui" }

async-trait = "0.1"
diesel = { version = "2.3", features = ["postgres", "postgres_backend", "uuid"] }
diesel-async = { version = "0.9.1", features = [
  "deadpool",
  "migrations",
  "postgres"
] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
dioxus = { version = "0.7.9" }
email_address = "0.2.9"
jiff = { version = "0.2", features = ["serde"] }
jiff-diesel = { version = "0.1.3" }
nutype = { version = "0.7.0", features = ["regex", "serde"] }
regex = "1.12.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = { version = "0.9.1" }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
